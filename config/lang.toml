# 语言文件：所有用户可见的文本集中管理
# 变量用法：${name} 会被替换为 bot_config.toml 中的 [bot] bot的名字

[bot]
fallback_reply = "喵～${name}刚刚没听清，可以再说一遍吗？"

[help]
header = "╭―――――― ${name} 指令帮助 ――――――╮"
footer = "╰――  /~help <指令> 查看详细用法  ――╯"
usage_hint = "/~help <指令>  查看某个指令的详细用法"
usage_example = "例如: /~help wzq"
not_found = "没有「${keyword}」的详细帮助喵~ 试试 /~help 看全部"

sections = [
    ["--- 聊天 ---", "@${name} <内容>     跟我说话"],
    ["--- 工具 ---", "/~s <关键词>        联网搜索", "/~remind <时间> <事> 定时提醒", "/~抽 <A> <B>        随机选择", "/~countdown <日期> <事> 倒计时"],
    ["--- 数据 ---", "/~stats [...]      群聊统计", "/~recall [数量]     撤回记录", "/~favlist           好感度"],
    ["--- 游戏 ---", "/~wzq ...          五子棋对战", "/~luck              今日运气值"],
    ["--- 系统 ---", "/~cost              Token消耗统计", "/~info             运行状态", "/~up [版本]         更新日志", "/~ping <目标>       全球延迟测试"],
    ["--- 主人专用 ---", "/~owner ...        配置/数据管理", "/~memory ...       记忆查询", "/~preset ...        提示词注入管理", "/~reload           热重载配置"],
]

[help.detail]
wzq = "【五子棋 /~wzq】\nduel @某人    发起挑战\naccept        接受挑战\ndecline       拒绝挑战\ncancel        取消未开始的挑战\n<坐标>        落子 (H8 / 8,8)\nai <难度> [nofb] 人机对战\nboard         查看棋盘\nsurrender     认输\nundo          悔棋\nstatus        对局信息\nhistory [N]   历史战绩"
remind = "【提醒 /~remind】\n/~remind 30分钟后 吃饭\n/~remind 明天14:30 开会\n到期自动 @ 提醒"
chou = "【抽签 /~抽】\n/~抽 吃面 吃饭 打游戏\n随机选一个 + 猫娘点评"
stats = "【统计 /~stats】\n/~stats         今日群聊统计\n/~stats 昨天    昨日群聊回顾"
recall = "【撤回 /~recall】\n/~recall        查看最近 5 条撤回\n/~recall 10     查看最近 10 条"
s = "【搜索 /~s】\n/~s Python asyncio 用法"
favlist = "【好感度 /~favlist】\n查看当前群/私聊的好感度排行"
luck = "【运气 /~luck】\n获取今日运气值 (1~100)"
up = "【更新日志 /~up】\n/~up            最新版本\n/~up 0.9.4      指定版本\n/~up all        完整日志"
updateinfo = "【更新日志 /~up】\n/~up            最新版本\n/~up 0.9.4      指定版本"
info = "【系统信息 /~info】\n显示运行状态: 系统/运行时间/内存/磁盘/CPU"
ping = "【全球延迟测试 /~ping】\n/~ping <域名或IP>  测试延迟\n数据来源: Globalping"
owner = "【配置管理 /~owner (主人)】"
memory = "【记忆管理 /~memory (主人)】\n/~memory list    查看所有记忆组\n/~memory read <群号> [N]  查看记忆\n/~memory search <群号> <词> 关键词搜索"
preset = "【提示词注入 /~preset (主人)】\n/~preset clear    清除注入"
reload = "【重载 /~reload (主人)】\n热重载 .toml 配置"
cost = "【Token消耗 /~cost】\n查看今日/累计 Token 消耗和预估费用"
token = "【Token计算 /~token】\n/~token <文本>   计算 token 数和费用"
draw = "【绘画 /~draw】\n/~draw <提示词>   文生图"
video = "【视频 /~video】\n/~video <提示词>  文生视频"
img2video = "【图生视频 /~img2video】\n/~img2video <图片URL>  图生视频"
eq = "【地震 /~eq】\n/~eq           最新 1 条地震速报\n/~eq 3         最新 3 条"


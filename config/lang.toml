tufsearch = "【TUF 搜索 /~tufsearch】\n/~tufsearch Freedom Dive   搜索谱面\n/~tufpage 2                翻页"

tuflevel = "【TUF 详情 /~tuflevel /~tuf谱面】\n/~tuflevel Galaxy Collapse  谱面详情卡片"

tufd = "【TUF 下载 /~tufd】\n/~tufd <编号>  下载谱面直链"

owner = "【配置管理 /~owner (主人)】\n/~owner wl show        查看白名单\n/~owner wl add <群号> atonly   添加仅@模式\n/~owner wl rmv <群号>  移除白名单\n/~owner prefix         查看当前拦截关键词\n/~owner prefix set <词1,词2>  设置关键词\n/~owner prefix clear    清空关键词\n/~owner stats          查看统计汇总"

memory = "【记忆管理 /~memory (主人)】\n/~memory list    查看所有记忆组\n/~memory read <群号> [N]  查看最近N条记忆\n/~memory search <群号> <词> 关键词搜索\n/~memory clean <群号>      清空记忆"

preset = "【提示词注入 /~preset (主人)】\n/~preset          查看已注入的提示词\n/~preset show     同上\n/~preset clear    清除注入"

analyze = "【零上下文分析 /~analyze (主人)】\n/~analyze test  测试分析能力\n发送任意非聊天内容给 bot 分析"

reload = "【重载 /~reload (主人)】\n热重载 .toml 配置，不重启 bot"

gh = "【公会登记 /~gh】\n/~gh add <公会名>        登记\n/~gh fix <公会名>        修改\n/~gh del                 删除\n/~gh list                查看列表\n/~gh new <qq> <公会名>   帮登记(需op)\n/~gh op <qq>             授权(仅主人)"


stats = "【统计 /~stats /~统计】\n/~stats         今日群聊统计\n/~stats 昨天    昨日群聊回顾\n自动 0 点发送日报"

recall = "【撤回 /~recall】\n/~recall        查看最近 5 条撤回\n/~recall 10     查看最近 10 条\n主动录制，100% 命中"

s = "【搜索 /~s】\n/~s Python asyncio 用法\n自动判断是否需要搜索 + DuckDuckGo"


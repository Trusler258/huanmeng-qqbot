token = "【Token计算 /~token /~tokens】\n/~token <文本>   用 DeepSeek tokenizer 计算 token 数\n显示预估输入/输出费用"

draw = "【绘画 /~draw】\n/~draw <提示词>                    文生图 (默认 1024x1024)\n/~draw 512x512 <提示词>           指定尺寸\n/~draw 1024x768 <提示词>          横版\n/~draw 768x1024 <提示词>          竖版\n支持分辨率: 256×256~1792×1792\n模型: agnes-image-2.1-flash (免费无限量)"

video = "【视频 /~video】\n/~video <提示词>                   文生视频 (默认 1152x768 81帧 24fps)\n/~video <提示词> 512x512           指定尺寸\n/~video <提示词> 768x768 121        指定尺寸+帧数\n/~video <提示词> 512x512 81 30      尺寸+帧数+fps\n模型: agnes-video-v2.0 (免费 500秒/天)"

img2video = "【图生视频 /~img2video】\n/~img2video <图片URL>               将图片转为视频\n/~img2video <图片URL> <描述>         带提示词的图生视频\n/~img2video <URL> 512x512            指定输出尺寸\n模型: agnes-video-v2.0 (免费 500秒/天)"


# 语言文件：所有用户可见的文本集中管理
# 变量用法：${name} 会被替换为 bot_config.toml 中的 [bot] bot的名字
# 其他变量见各条注释

[bot]
fallback_reply = "喵～${name}刚刚没听清，可以再说一遍吗？"

[help]
header = "╭―――――― ${name} 指令帮助 ――――――╮"
footer = "╰――  /~help <指令> 查看详细用法  ――╯"
usage_hint = "/~help <指令>  查看某个指令的详细用法"
usage_example = "例如: /~help wzq, /~help weather"
not_found = "没有「${keyword}」的详细帮助喵~ 试试 /~help 看全部"

# 分类 + 指令列表 (数组 of 数组: ["标签", "文本"])
sections = [
    ["--- 聊天 ---", "@${name} <内容>     跟我说话（也会自动判断插话）", "{{提示词}}         注入临时人设（仅主人）"],
    ["--- 工具 ---", "/~天气 <城市>      7 天天气预报", "/~eq [数量]        地震速报", "/~md <内容>         Markdown卡片", "/~box <单号>        快递物流", "/~s <关键词>        联网搜索", "/~remind <时间> <事> 定时提醒", "/~抽 <A> <B>        随机选择", "/~tr <语言> <文本>  翻译 (中英日韩法德)", "/~countdown <日期> <事> 倒计时"],
    ["--- 数据 ---", "/~stats [...]      群聊统计 (昨天/今日)", "/~recall [数量]     撤回记录", "/~favlist           好感度"],
    ["--- 游戏 ---", "/~wzq ...          五子棋对战", "/~wdsj <模式> <名>  洛花星雨战绩", "/~luck              今日运气值", "/~gh                公会登记"],
    ["--- 音游 (TUF) ---", "/~tufsearch /~tuflevel /~tufd /~tufpage"],
    ["--- 系统 ---", "/~cost              Token消耗统计", "/~info             运行状态", "/~up [版本]         更新日志", "/~ping <目标>       全球延迟测试", "/~md <内容>         Markdown卡片"],
    ["--- 主人专用 ---", "/~owner ...        配置/数据管理", "/~memory ...       记忆查询", "/~preset ...        提示词注入管理", "/~analyze ...      零上下文日志分析", "/~reload           热重载配置", "/~token ...        Debug token计算"],
]

# 详细帮助（按指令名查找）
[help.detail]
wzq = "【五子棋 /~wzq】\nduel @某人    发起挑战\naccept        接受挑战\ndecline       拒绝挑战\ncancel        取消未开始的挑战\n<坐标>        落子 (H8 / 8,8)\nai <难度> [nofb] 人机对战 (可选无禁手)\nboard         查看棋盘\nsurrender     认输\nundo          悔棋 (对手再发一次确认)\nstatus        对局信息\nhistory [N]   历史战绩\nhistory <编号> board 查看对局棋盘"

weather = "【天气 /~天气 /~weather】\n/~天气 深圳       查询深圳7天天气\n/~weather Beijing  支持中文和英文城市名\n自动生成精美天气卡片"

box = "【快递 /~box】\n/~box 73706815751505   查询快递单号\n显示物流轨迹、当前状态、预估送达\n失败自动降级为纯文本"

remind = "【提醒 /~remind /~提醒】\n/~remind 30分钟后 吃饭\n/~remind 2小时后 开会\n/~remind 明天14:30 午休\n/~remind 14:30 下班\n到期自动 @ 提醒"


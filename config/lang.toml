sections = [
    ["--- 聊天 ---", "@${name} <内容>     跟我说话"],
    ["--- 工具 ---", "/~s <关键词>        联网搜索", "/~remind <时间> <事> 定时提醒", "/~抽 <A> <B>        随机选择", "/~countdown <日期> <事> 倒计时"],

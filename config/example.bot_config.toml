# bot_config.toml — QQ Bot 主配置
# 复制为 bot_config.toml 并填入你的值
#
# API 密钥推荐写 .env（更安全），bot_config.toml 也可写但会被 .env 覆盖

[bot]
name = "幻梦"
bot_qq = 0               # 机器人 QQ 号

# === LLM 后端 ===
[llm]
reply_provider = "deepseek"
judge_provider = "siliconflow"
image_provider = "siliconflow"

[llm.deepseek]
model = "deepseek-chat"
# api_key 写 .env，这里留空

[llm.siliconflow]
model = "deepseek-ai/DeepSeek-V3"
image_model = "glm-4v-flash"
# api_key 写 .env，这里留空

# === 适配器 ===
[adapter]
type = "napcat"
ws_url = "ws://127.0.0.1:8099/"

# === 功能开关 ===
[features]
auto_reply = true
search_enabled = true
memory_enabled = true
image_recognition = true

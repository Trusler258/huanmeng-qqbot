# 幻梦 Bot 控制面板反代层 (2026-09-12)
#
# 链路: Cloudflare → cloudflared(panel.truslerweb.dpdns.org) → 127.0.0.1:49300
#       → 本 server 块 → 127.0.0.1:59300 (panel.service, FastAPI)
#
# 四层防御中的第 2 层：BasicAuth。即使应用层 JWT 被绕过，还要先过这里。
# 注意：不剥前缀（面板前端直接部署在根路径）。

server {
    listen 127.0.0.1:49300;
    server_name _;

    auth_basic "幻梦 Bot 控制面板";
    auth_basic_user_file /www/server/nginx/conf/htpasswd.bot;

    # 面板体积不大，但接口返回可能较大（日志/配置）
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:59300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（/api/logs/ws 实时日志）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

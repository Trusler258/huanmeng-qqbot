<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>skin render</title>
<style>
  html, body { margin: 0; padding: 0; background: #101218; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="vendor/skinview3d.bundle.js"></script>
<script>
  // 由 Python 侧替换：__W__ / __H__ / __ZOOM__
  const W = __W__, H = __H__;
  const glCanvas = document.getElementById("c");
  const viewer = new skinview3d.SkinViewer({
    canvas: glCanvas,
    width: W,
    height: H,
    preserveDrawingBuffer: true,   // toDataURL 必须开
    fov: 45,
    zoom: __ZOOM__,
    autoRotate: false,
    animation: new skinview3d.IdleAnimation(),
    nameTag: null,
  });

  // 离屏 2D canvas：把 WebGL 画面合成到渐变背景上，再编码。
  // 这么做一是 JPEG 编码远快于 PNG（导出速度的主要瓶颈），
  // 二是能带上渐变背景（WebGL canvas 本身不透明）。
  const outCanvas = document.createElement("canvas");
  outCanvas.width = W;
  outCanvas.height = H;
  const ctx = outCanvas.getContext("2d");
  const grad = ctx.createRadialGradient(
    W * 0.5, H * 0.40, Math.min(W, H) * 0.06,
    W * 0.5, H * 0.40, Math.max(W, H) * 0.75);
  grad.addColorStop(0, "#2b3040");
  grad.addColorStop(0.58, "#1b1f29");
  grad.addColorStop(1, "#0f1117");

  function snap(mime, q) {
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(glCanvas, 0, 0, W, H);
    return outCanvas.toDataURL(mime || "image/jpeg", q || 0.9);
  }

  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const raf2 = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  // ══ 相位驱动的自定义姿态 ═════════════════════════════════════
  // ⚠️ 为什么不用内置 WalkingAnimation / RunningAnimation 的自动推进：
  //   skinview3d 按**真实时间**累加 progress，而这里每帧渲染要 ~100ms（SwiftShader），
  //   48 帧累计 4.8 秒的动作被塞进 1.6 秒的 GIF 播放 → 观感明显加速，
  //   而且采样段不是整周期，首尾接不上、不像循环。
  // 现在相位 __phase 由 shootAnim 按 i/frames 逐帧写死：
  //   动作只取决于帧序号，与真实耗时无关；整段正好覆盖整数个周期 → 首尾天然闭合。
  let __phase = 0;

  const POSES = {
    // 走路：完整复刻 bundle 里 WalkingAnimation.animate 的公式（t = 8 * progress）
    walk: (pl) => {
      const t = 8 * __phase;
      const s = pl.skin;
      s.leftLeg.rotation.x = 0.5 * Math.sin(t);
      s.rightLeg.rotation.x = 0.5 * Math.sin(t + Math.PI);
      s.leftArm.rotation.x = 0.5 * Math.sin(t + Math.PI);
      s.rightArm.rotation.x = 0.5 * Math.sin(t);
      const k = 0.02 * Math.PI;
      s.leftArm.rotation.z = 0.03 * Math.cos(t) + k;
      s.rightArm.rotation.z = 0.03 * Math.cos(t + Math.PI) - k;
      // 头保持正：bundle 原版 WalkingAnimation 有 headBobbing（左右 11°、点头 6°），
      // 动图里看着像在摇头，用户明确说"头会动"，这里归零
      s.head.rotation.y = 0;
      s.head.rotation.x = 0;
      if (pl.cape) pl.cape.rotation.x = 0.06 * Math.sin(t / 1.5) + 0.06 * Math.PI;
    },
    // 跑步：摆幅更大（1.3 rad）、频率更快（t = 15 * progress），身体略前倾
    run: (pl) => {
      const t = 15 * __phase;
      const s = pl.skin;
      s.leftLeg.rotation.x = 1.3 * Math.cos(t + Math.PI);
      s.rightLeg.rotation.x = 1.3 * Math.cos(t);
      s.leftArm.rotation.x = 1.3 * Math.cos(t);
      s.rightArm.rotation.x = 1.3 * Math.cos(t + Math.PI);
      s.leftArm.rotation.z = 0.05;
      s.rightArm.rotation.z = -0.05;
      s.head.rotation.y = 0;
      s.head.rotation.x = 0;
      if (pl.cape) pl.cape.rotation.x = 0.4 + 0.08 * Math.sin(t);
    },
    // 飞行：手臂前伸，轻微上下摆动（真正的高度变化由 wrapper.position.y 另做）
    fly: (pl) => {
      const t = 2 * __phase;
      const s = pl.skin;
      s.leftArm.rotation.x = -1.35 + 0.08 * Math.sin(t);
      s.rightArm.rotation.x = -1.35 + 0.08 * Math.sin(t + Math.PI);
      s.leftLeg.rotation.x = 0.12 * Math.sin(t);
      s.rightLeg.rotation.x = 0.12 * Math.sin(t + Math.PI);
      s.head.rotation.x = -0.12;
      if (pl.cape) pl.cape.rotation.x = 0.65 + 0.1 * Math.sin(t);
    },
  };

  // 姿态动作借用的内置动画类（只用它的壳，animate 已被覆盖）
  const POSE_CLASS = {
    walk: () => { const a = new skinview3d.WalkingAnimation(); a.speed = 1; return a; },
    run: () => { const a = new skinview3d.RunningAnimation(); a.speed = 1; return a; },
    fly: () => { const a = new skinview3d.IdleAnimation(); a.speed = 1; return a; },
  };

  // 其他动作仍走内置动画（只要相位静止即可，不需要精确周期）
  const ANIMS = {
    walk: () => { const a = new skinview3d.WalkingAnimation(); a.speed = 1; return a; },
    run: () => { const a = new skinview3d.RunningAnimation(); a.speed = 1; return a; },
    fly: () => { const a = new skinview3d.IdleAnimation(); a.speed = 1; return a; },
    idle: () => new skinview3d.IdleAnimation(),
    wave: () => new skinview3d.WaveAnimation(),
    swim: () => new skinview3d.SwimAnimation(),
    crouch: () => new skinview3d.CrouchAnimation(),
    hit: () => new skinview3d.HitAnimation(),
    still: () => new skinview3d.IdleAnimation(),
  };

  // 内置动画的 progress 周期（t = k*progress → 周期 2π/k）
  const PERIODS = { idle: Math.PI, still: Math.PI, wave: 2.0, swim: 1.3,
                    hit: 0.3490659, crouch: Math.PI,
                    walk: 2 * Math.PI / 8, run: 2 * Math.PI / 15, fly: Math.PI };

  window.__viewer = viewer;      // 诊断/工具函数要用（重写时漏掉过，坑了一整轮）

  function findPlayer() {
    const v = window.__viewer;
    if (v.playerObject && v.playerObject.skin) return v.playerObject;
    let found = null;
    try {
      v.playerWrapper.traverse((o) => { if (!found && o && o.skin) found = o; });
    } catch (e) { /* ignore */ }
    return found;
  }

  window.__ready = true;

  window.prepare = async (skinUrl, anim, capeUrl, speed) => {
    await viewer.loadSkin(skinUrl);
    if (capeUrl) {
      try { await viewer.loadCape(capeUrl); }
      catch (e) { console.warn("cape load failed", e); }
    }
    const key = anim || "idle";
    if (POSES[key]) {
      // ★ 关键：挂一个 paused 的动画 —— 只为让 viewer 继续跑渲染循环，
      //   但 update() 第一行就 return，绝不会用内置动画覆盖我们写的骨骼。
      //   （speed=0 不行：update 仍会执行 animate；paused=true 才彻底不跑）
      viewer.animation = new skinview3d.IdleAnimation();
      viewer.animation.paused = true;
    } else {
      viewer.animation = (ANIMS[key] || ANIMS.idle)();
      viewer.animation.speed = (speed === undefined || speed === null) ? 1 : speed;
    }
    __phase = 0;
    window.__pose = !!POSES[key];
    viewer.playerWrapper.rotation.x = 0;
    viewer.playerWrapper.rotation.y = 0;
    viewer.playerWrapper.position.y = 0;
    window.__anim = key;
    window.__pl = findPlayer();
    await raf2();
    await new Promise((r) => setTimeout(r, 250));
    await raf2();
    return true;
  };

  // 逐帧取动作帧：写死相位 → 摆骨骼 → 等一帧让 viewer 自己渲染 → 取图。
  // 相位只由帧序号决定，与真实耗时无关，因此整段覆盖整数周期时首尾天然闭合。
  window.seek = async (arr) => {
    const [progress, yaw, flyY, flyRx, mime, q] = arr;
    const v = window.__viewer;
    __phase = progress;
    if (yaw !== null && yaw !== undefined) v.playerWrapper.rotation.y = yaw;
    if (flyY !== null && flyY !== undefined) {
      v.playerWrapper.position.y = flyY;
      v.playerWrapper.rotation.x = flyRx || 0;
    }
    const pose = POSES[window.__anim];
    const pl = window.__pl;
    if (pose && pl && pl.skin) {
      pose(pl);                        // 纯姿态，不依赖任何动画对象
      await raf2();                    // animation 已 paused → 不会被覆盖，viewer 渲染我们的姿态
    } else if (v.animation) {
      v.animation.progress = progress;
      await raf2();
    }
    return snap(mime, q);
  };

  // 固定视角播放动作：内置动画自动推进（真实时间），每帧等一次 rAF
  window.shootAnim = async (frames, yaw, mime, q, cycles) => {
    viewer.playerWrapper.rotation.y = yaw;
    const out = [];
    for (let i = 0; i < frames; i++) {
      if (window.__anim === "fly") {
        const ph = (i / frames) * Math.PI * 2 * (cycles || 1);
        viewer.playerWrapper.position.y = Math.sin(ph) * 3.2;
        viewer.playerWrapper.rotation.x = Math.sin(ph * 2) * 0.05;
      }
      await raf();
      out.push(snap(mime, q));
    }
    return out;
  };

  // 指定角度取单帧（三视图用，PNG 保质量）
  window.shootAngles = async (angles, mime, q) => {
    const out = [];
    for (let i = 0; i < angles.length; i++) {
      viewer.playerWrapper.rotation.y = angles[i];
      await raf2();
      out.push(snap(mime || "image/png", q || 1));
    }
    return out;
  };
</script>
</body>
</html>

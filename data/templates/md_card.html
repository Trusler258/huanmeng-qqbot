<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=520, initial-scale=1.0">
<style>
@page{margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{width:520px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e0e0e0;background:#0f1923;padding:18px;line-height:1.65}
h1{font-size:20px;color:#4fc3f7;margin-bottom:10px;border-bottom:2px solid rgba(79,195,247,0.3);padding-bottom:8px}
h2{font-size:16px;color:#81d4fa;margin:14px 0 6px;border-left:3px solid #4fc3f7;padding-left:8px}
h3{font-size:14px;color:#b0bec5;margin:10px 0 4px}
p{margin:4px 0}
code{background:rgba(79,195,247,0.12);color:#4fc3f7;padding:1px 5px;border-radius:3px;font-size:12px}
pre{background:rgba(0,0,0,0.3);padding:10px 14px;border-radius:6px;font-size:12px;line-height:1.5;overflow-x:auto;margin:6px 0;border:1px solid rgba(255,255,255,0.06)}
pre code{background:none;padding:0;font-size:12px}
table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
th{background:rgba(79,195,247,0.12);color:#81d4fa;padding:5px 8px;text-align:left;border:1px solid rgba(255,255,255,0.08)}
td{padding:4px 8px;border:1px solid rgba(255,255,255,0.06)}
tr:nth-child(even){background:rgba(255,255,255,0.03)}
hr{border:none;border-top:1px solid rgba(255,255,255,0.08);margin:10px 0}
ul,ol{margin:4px 0 4px 18px;font-size:13px}
li{margin:2px 0}
strong{color:#81d4fa}
.footer{margin-top:14px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;color:#546e7a;text-align:center}
</style>
</head>
<body>
{{CONTENT}}
<div class="footer">{{BRAND}}</div>
</body>
</html>

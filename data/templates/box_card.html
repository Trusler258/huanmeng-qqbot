<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>快递物流卡片 · 幻梦</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════
   幻梦 Design System — 快递卡片
   ═══════════════════════════════════════ */
:root {
  --primary:       #ec4899;
  --primary-light: #f472b6;
  --primary-pale:  rgba(236,72,153,0.10);
  --primary-glow:  rgba(236,72,153,0.22);

  --bg-page:  #0d0d1a;
  --bg-card:  rgba(255,255,255,0.04);
  --bg-row:   rgba(255,255,255,0.025);

  --text-primary:   #ffffff;
  --text-secondary: rgba(255,255,255,0.58);
  --text-muted:     rgba(255,255,255,0.33);

  --success: #10b981;
  --warning: #f59e0b;
  --error:   #ef4444;
  --info:    #3b82f6;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;

  --shadow-card: 0 8px 40px rgba(0,0,0,0.55), 0 0 100px rgba(236,72,153,0.06);

  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --border: rgba(255,255,255,0.07);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 760px;
  margin: 0 auto;
  background: transparent;
}

body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 65% 45% at 5% -5%,  rgba(236,72,153,0.16) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 95% 105%, rgba(244,114,182,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 50% 50%,  rgba(59,130,246,0.04) 0%, transparent 60%),
    linear-gradient(165deg, #0d0d1a 0%, #110e1c 50%, #0d1020 100%);
  min-height: 100vh;
}

/* ── 卡片外壳 ── */
.card-wrapper { padding: 28px 24px 36px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow: hidden;
  position: relative;
}

.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary) 25%, var(--primary-light) 60%, rgba(59,130,246,0.6) 100%);
}

/* ── 头部 ── */
.header { padding: 26px 30px 20px; }

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* 快递图标块 */
.cp-icon-wrap {
  width: 50px; height: 50px;
  border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  background: linear-gradient(135deg, rgba(236,72,153,0.18), rgba(244,114,182,0.12));
  border: 1px solid rgba(236,72,153,0.25);
  box-shadow: 0 2px 16px rgba(236,72,153,0.2);
  flex-shrink: 0;
}

.cp-info {}
.cp-name { font-size: 18px; font-weight: 700; }

.tracking-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 4px;
}
.tracking-no {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--primary-light);
  letter-spacing: 0.5px;
  margin-top: 2px;
}

/* 状态标签 */
.state-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.badge-signed     { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.28); box-shadow: 0 0 14px rgba(16,185,129,0.12); }
.badge-delivering { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.28); box-shadow: 0 0 14px rgba(59,130,246,0.12); }
.badge-transport  { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.28); box-shadow: 0 0 14px rgba(245,158,11,0.12); }
.badge-pending    { background: rgba(148,163,184,0.10); color: #94a3b8; border: 1px solid rgba(148,163,184,0.22); }
.badge-return     { background: rgba(239,68,68,0.12);  color: #f87171; border: 1px solid rgba(239,68,68,0.28);  box-shadow: 0 0 14px rgba(239,68,68,0.12); }

/* 分割线 */
.divider {
  height: 1px;
  margin: 0 28px;
  background: linear-gradient(90deg,
    transparent,
    var(--border) 15%,
    rgba(236,72,153,0.28) 50%,
    var(--border) 85%,
    transparent
  );
}

/* ── 最新动态条 ── */
.latest-section { margin: 0 30px; padding: 12px 16px; }

.latest-bar {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(90deg, rgba(236,72,153,0.07), rgba(59,130,246,0.04));
  border: 1px solid rgba(236,72,153,0.14);
  font-size: 13.5px;
  line-height: 1.65;
}
.latest-bar .bar-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  opacity: 0.7;
}
.latest-bar .bar-msg { color: var(--text-secondary); }

/* ── 时间线 ── */
.timeline-section { padding: 8px 30px 24px; }

.section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary-light);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 3px; height: 14px;
  background: linear-gradient(180deg, var(--primary), var(--primary-light));
  border-radius: 2px;
}

.timeline {
  position: relative;
  padding-left: 30px;
}
/* 竖线 */
.timeline::before {
  content: '';
  position: absolute;
  left: 7px; top: 6px; bottom: 6px;
  width: 2px;
  background: linear-gradient(180deg, var(--primary) 0%, rgba(236,72,153,0.3) 60%, transparent 100%);
  border-radius: 2px;
}

.timeline-item {
  position: relative;
  margin-bottom: 14px;
}
.timeline-item:last-child { margin-bottom: 0; }

/* 圆点 */
.tl-dot {
  position: absolute;
  left: -30px;
  top: 5px;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(236,72,153,0.35);
  background: var(--bg-page);
  z-index: 2;
}
.tl-dot.active {
  border-color: var(--primary);
  background: var(--primary);
  box-shadow: 0 0 10px rgba(236,72,153,0.5), 0 0 22px rgba(236,72,153,0.2);
  animation: pulse-dot 2.2s ease-in-out infinite;
}
.tl-dot.done {
  border-color: rgba(16,185,129,0.5);
  background: rgba(16,185,129,0.2);
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.7; transform: scale(0.85); }
}

/* 内容卡 */
.tl-card {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  transition: all 0.18s;
}
.tl-card:hover { background: rgba(236,72,153,0.05); border-color: rgba(236,72,153,0.12); }
.tl-card.current { background: rgba(236,72,153,0.07); border-color: rgba(236,72,153,0.18); }

.tl-time {
  display: block;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--primary-light);
  letter-spacing: 0.5px;
  margin-bottom: 3px;
  opacity: 0.75;
}
.tl-msg {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.6;
  word-break: break-all;
}

/* ── 提示条 ── */
.tip-bar {
  margin: 0 30px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  text-align: center;
}
.tip-delivering {
  color: #60a5fa;
  background: rgba(59,130,246,0.05);
  border: 1px dashed rgba(59,130,246,0.2);
}
.tip-signed {
  color: var(--success);
  background: rgba(16,185,129,0.05);
  border: 1px dashed rgba(16,185,129,0.2);
}

/* ── 底部 ── */
.footer {
  padding: 12px 30px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
}
.footer-tags { display: flex; gap: 8px; }
.footer-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  font-size: 10.5px;
  color: var(--text-muted);
}
.footer-brand {
  font-size: 10px;
  color: var(--primary);
  opacity: 0.45;
  letter-spacing: 1.5px;
  font-weight: 700;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <!-- 头部 -->
    <div class="header">
      <div class="header-row">
        <div class="header-left">
          <div class="cp-icon-wrap">📦</div>
          <div class="cp-info">
            <div class="cp-name">{{CP_NAME}}</div>
            <div class="tracking-label">Tracking No.</div>
            <div class="tracking-no">{{TRACKING_NO}}</div>
          </div>
        </div>
        <div class="state-badge {{STATE_CLASS}}">{{STATE_ICON}} {{STATE_TEXT}}</div>
      </div>
    </div>

    <!-- 最新动态 -->
    {{LATEST_SECTION}}

    <div class="divider" style="margin-top:16px;"></div>

    <!-- 物流时间线 -->
    <div class="timeline-section">
      <div class="section-title">物流轨迹</div>
      <div class="timeline">{{TIMELINE_ITEMS}}</div>
    </div>

    <!-- 提示条 -->
    {{TIP_SECTION}}

    <div class="divider" style="margin-top:16px;"></div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer-tags">
        <span class="footer-tag">📦 物流查询</span>
        <span class="footer-tag">{{QUERY_TIME}}</span>
      </div>
      <div class="footer-brand">{{BRAND}}</div>
    </div>

  </div>
</div>

</body>
</html>

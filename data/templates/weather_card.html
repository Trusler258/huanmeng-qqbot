<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>天气卡片 · 幻梦</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════
   幻梦 Design System — 天气卡片
   ═══════════════════════════════════════ */
:root {
  /* 主色 · 粉色系 */
  --primary:       #ec4899;
  --primary-light: #f472b6;
  --primary-pale:  rgba(236,72,153,0.12);
  --primary-glow:  rgba(236,72,153,0.25);

  /* 背景 */
  --bg-page:       #0d0d1a;
  --bg-card:       rgba(255,255,255,0.04);
  --bg-row:        rgba(255,255,255,0.03);

  /* 文字 */
  --text-primary:   #ffffff;
  --text-secondary: rgba(255,255,255,0.60);
  --text-muted:     rgba(255,255,255,0.35);

  /* 状态色 */
  --success:  #10b981;
  --warning:  #f59e0b;
  --error:    #ef4444;
  --info:     #38bdf8;

  /* 点缀 */
  --orange:   #fb923c;
  --sky:      #7dd3fc;
  --cyan:     #22d3ee;

  /* 圆角 */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;

  /* 阴影 */
  --shadow-card: 0 8px 40px rgba(0,0,0,0.5), 0 0 100px rgba(236,72,153,0.06);

  /* 字体 */
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* 边框 */
  --border: rgba(255,255,255,0.07);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 760px;
  margin: 0 auto;
  background: transparent;
}

body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 70% 50% at 15% -10%, rgba(236,72,153,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 110%, rgba(244,114,182,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 50% 50%,  rgba(56,189,248,0.04) 0%, transparent 65%),
    linear-gradient(165deg, #0d0d1a 0%, #13101f 50%, #0d1525 100%);
  min-height: 100vh;
}

/* ── 卡片外壳 ── */
.card-wrapper { padding: 28px 24px 36px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  overflow: hidden;
  position: relative;
}

/* 顶部粉色条 */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--primary) 30%, var(--primary-light) 60%, var(--cyan) 100%);
}

/* ── 头部 ── */
.header {
  padding: 28px 30px 22px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: relative;
}

/* 城市 + 日期 */
.header-left {}
.city-name {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #fff 30%, var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
.header-date {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 5px;
  letter-spacing: 0.5px;
  font-weight: 300;
}

/* 天气图标 + 温度 */
.header-right {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.weather-icon-main {
  font-size: 48px;
  line-height: 1;
  filter: drop-shadow(0 2px 12px rgba(236,72,153,0.3));
  margin-bottom: 4px;
}
.temp-main {
  font-size: 46px;
  font-weight: 900;
  line-height: 1;
  font-family: var(--font-mono);
  background: linear-gradient(180deg, #fff 20%, var(--sky));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.temp-meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 3px;
}

/* 分割线 */
.divider {
  height: 1px;
  margin: 0 28px;
  background: linear-gradient(90deg,
    transparent,
    var(--border) 15%,
    rgba(236,72,153,0.3) 50%,
    var(--border) 85%,
    transparent
  );
}

/* ── 播报区 ── */
.talk-section { padding: 16px 30px; display: flex; flex-direction: column; gap: 6px; }

.talk-item {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-secondary);
  background: var(--bg-row);
  border-left: 2.5px solid rgba(56,189,248,0.5);
  line-height: 1.65;
  transition: background 0.15s;
}
.talk-item:hover { background: rgba(255,255,255,0.05); }
.talk-item.highlight {
  background: rgba(236,72,153,0.07);
  border-left-color: var(--primary);
  color: var(--text-primary);
}
.talk-item.warning {
  background: rgba(251,146,60,0.07);
  border-left-color: var(--orange);
}
.talk-item.danger {
  background: rgba(239,68,68,0.07);
  border-left-color: var(--error);
}

/* ── 7日预报 ── */
.forecast-section { padding: 10px 30px 24px; }

.section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary-light);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 3px; height: 14px;
  background: linear-gradient(180deg, var(--primary), var(--primary-light));
  border-radius: 2px;
}

.forecast-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
}

.forecast-table thead th {
  padding: 10px 8px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 1px solid rgba(236,72,153,0.15);
  background: rgba(236,72,153,0.05);
}

.forecast-table td {
  padding: 10px 6px;
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: background 0.15s, color 0.15s;
}
.forecast-table tbody tr:last-child td { border-bottom: none; }
.forecast-table tbody tr:nth-child(even) td { background: var(--bg-row); }
.forecast-table tbody tr:hover td {
  background: rgba(236,72,153,0.06);
  color: var(--text-primary);
}

/* 今日高亮 */
.forecast-table tbody tr.today-row td {
  background: rgba(236,72,153,0.09) !important;
  color: var(--text-primary);
  font-weight: 600;
}
.today-label {
  display: inline-block;
  font-size: 9.5px;
  background: var(--primary);
  color: #fff;
  padding: 1px 6px;
  border-radius: 6px;
  font-weight: 700;
  margin-bottom: 2px;
  letter-spacing: 0.3px;
}

/* 天气图标 */
.weather-icon-cell { font-size: 20px !important; vertical-align: middle !important; }

/* 温度颜色 */
.temp-high { color: var(--orange); font-weight: 600; }
.temp-low  { color: var(--sky); }

/* AQI 徽章 */
.aqi-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.aqi-excellent { background: rgba(16,211,153,0.12);  color: #34d399; border: 1px solid rgba(52,211,153,0.25); }
.aqi-good      { background: rgba(125,211,252,0.12); color: #7dd3fc; border: 1px solid rgba(125,211,252,0.25); }
.aqi-moderate  { background: rgba(251,191,36,0.12);  color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
.aqi-poor      { background: rgba(251,146,60,0.12);  color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
.aqi-bad       { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }

/* ── AQI 总评 ── */
.aqi-summary-section { padding: 0 30px 20px; }
.summary-box {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(90deg, rgba(236,72,153,0.07), rgba(34,211,238,0.04));
  border: 1px solid rgba(236,72,153,0.15);
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.7;
}

/* ── 底部 ── */
.footer {
  padding: 12px 30px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}
.footer-tags { display: flex; gap: 8px; }
.footer-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  font-size: 10.5px;
  color: var(--text-muted);
}
.footer-brand {
  font-size: 10px;
  color: var(--primary);
  opacity: 0.45;
  letter-spacing: 1.5px;
  font-weight: 700;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <!-- 头部 -->
    <div class="header">
      <div class="header-left">
        <div class="city-name">{{CITY_NAME}}</div>
        <div class="header-date">{{HEADER_DATE}}</div>
      </div>
      <div class="header-right">
        <div class="weather-icon-main">{{TODAY_ICON}}</div>
        <div class="temp-main">{{TODAY_TEMP}}°</div>
        <div class="temp-meta">{{TODAY_COND}} · {{TEMP_RANGE}}</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 口语化播报 -->
    {{TALK_SECTION}}

    <!-- 7日预报 -->
    <div class="divider" style="margin-top:4px;"></div>
    <div class="forecast-section">
      <div class="section-title">七日预报</div>
      <table class="forecast-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>天气</th>
            <th>最高</th>
            <th>最低</th>
            <th>风向风力</th>
            <th>AQI</th>
          </tr>
        </thead>
        <tbody>{{FORECAST_ROWS}}</tbody>
      </table>
    </div>

    <!-- AQI 总评 -->
    <div class="divider"></div>
    <div class="aqi-summary-section" style="padding-top:16px;">
      <div class="section-title">空气质量总评</div>
      <div class="summary-box">{{AQI_SUMMARY}}</div>
    </div>

    <div class="divider"></div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer-tags">
        <span class="footer-tag">🌤️ 天气数据</span>
        <span class="footer-tag">{{DATA_TIME}}</span>
      </div>
      <div class="footer-brand">{{BRAND}}</div>
    </div>

  </div>
</div>

</body>
</html>

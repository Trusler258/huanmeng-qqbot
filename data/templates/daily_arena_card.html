  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{border-radius:24px;padding:20px 22px 16px;border:1px solid rgba(255,255,255,.9);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 14px 34px rgba(120,90,70,.10), inset 0 1px 0 rgba(255,255,255,.95)}
  .head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
  .head .hic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .head .hic img{width:32px;height:32px;image-rendering:pixelated}
  .title{font-size:21px;font-weight:800;letter-spacing:.5px}
  .sub{font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
  .head .when{margin-left:auto;text-align:right;font-size:12px;line-height:1.5}
  table{width:100%;border-collapse:collapse}
  th{font-size:12.5px;font-weight:600;padding:8px 5px;text-align:left;white-space:nowrap}
  th img{width:17px;height:17px;vertical-align:-3.5px;image-rendering:pixelated;margin-right:3px}
  th.num,td.num{text-align:center}
  .th-hint{font-size:10.5px;font-weight:500;opacity:.72;margin-left:1px}
  td{padding:9px 5px;font-size:14px}
  tbody tr{border-top:1px solid}
  td.rank{width:68px;text-align:left;padding-left:8px;white-space:nowrap}
  /* 名次：图标占固定槽位（无名次图标时留空），数字起点固定 → 所有行数字对齐同一条竖线 */
  td.rank .rk{display:inline-flex;align-items:center;gap:5px}
  td.rank .medal{width:21px;height:21px;flex:none;display:inline-flex;align-items:center;justify-content:center}
  td.rank .medal img{width:21px;height:21px;image-rendering:pixelated}
  td.rank .n{font-family:"Monocraft",monospace;font-size:12.5px;min-width:15px;text-align:left;opacity:.8}
  td.name{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.num{font-family:"Monocraft","PingFang SC",monospace;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
  .up{font-size:11.5px;opacity:.62;margin-left:1px}
  .newp{margin-top:12px;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.6}
  .newp img{width:15px;height:15px;vertical-align:-3px;image-rendering:pixelated;margin-right:3px}
  .foot{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px;
    font-variant-numeric:tabular-nums}
  .foot .sep{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(150,130,110,.25),transparent)}
  .hash{font-family:"Monocraft",monospace;font-size:11.5px;padding:2px 7px;border-radius:6px}
  .next{padding:2px 7px;border-radius:6px}

  body{width:660px;padding:22px;background:radial-gradient(640px 340px at 8% -10%, rgba(148,184,255,.58), transparent 60%), radial-gradient(320px 220px at 98% -4%, rgba(190,214,255,.48), transparent 62%), linear-gradient(160deg,#f3f8ff 0%,#eaf1fc 45%,#efeff8 100%)}
  .wrap{background:rgba(246,250,255,.78)}
  .head .hic{background:linear-gradient(135deg, rgba(128,168,255,.46), rgba(79,110,224,.22))}
  .title{color:#28334f}
  .sub,.head .when{color:#8792a8}
  th{color:#7d88a0;border-bottom:1.5px solid rgba(168,190,228,.58)}
  tbody tr{border-color:rgba(180,198,230,.32)}
  td{color:#3a4459}
  td.num{color:#3d63e0}
  .up{color:#8792a8}
  .newp{background:rgba(200,215,255,.55);color:#4a5f92}
  .foot{color:#98a2b6}
  .hash{background:rgba(150,130,110,.09);color:#c2b8ad}
  .next{background:rgba(200,215,255,.55);color:#4a5f92}
</style></head>

  const parts = s.split("\u00a7");
  let out = parts[0] || "";
  for (let i = 1; i < parts.length; i++){
    const code = (parts[i].charAt(0) || "").toLowerCase();
    const rest = parts[i].slice(1);
    if (MC_FMT[code]) { out += rest; continue; }
    const col = MC_LIGHT_ADAPT[code] || MC_COLORS[code];
    out += col ? `<span style="color:${col}">${rest}</span>` : rest;
  }
  return out;
}

function hash8(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, "0").slice(0, 8);
}

(function render(){
  const D = window.DAILY_DATA;
  if (!D) return;
  document.getElementById("sub").textContent = D.date + (D.range ? " · " + D.range : "");
  document.getElementById("when").innerHTML = D.when || "";

  document.getElementById("thead-row").innerHTML = COLS.map(c =>
    `<th class="${c.num ? 'num' : ''}">${c.icon ? `<img src="${c.icon}">` : ''}${c.label}`
    + (c.hint ? `<span class="th-hint">${c.hint}</span>` : '') + `</th>`
  ).join("");

  document.getElementById("rows").innerHTML = (D.rows || []).map(r => {
    const medal = MEDAL[r.rank];
    const rankCell = `<span class="rk"><span class="medal">${medal ? `<img src="${medal}">` : ""}</span>`
                   + `<span class="n">${r.rank}</span></span>`;
    const cells = COLS.slice(1).map(c => {
      const v = (r.cells && r.cells[c.key] != null) ? r.cells[c.key] : "—";
      const sub = (c.subKey && r.cells && r.cells[c.subKey]) ? `<span class="up">(${r.cells[c.subKey]})</span>` : "";
      const shown = (c.key === "div") ? mcColor(v) : v;
      return `<td class="${c.num ? 'num' : ''}">${shown}${sub}</td>`;
    }).join("");
    return `<tr><td class="rank">${rankCell}</td>` + cells + `</tr>`;
  }).join("");

  const np = document.getElementById("newp");
  if (D.newPlayers && D.newPlayers.length){
    const names = D.newPlayers.slice(0, 8).join("、");
    const more = D.newPlayers.length > 8 ? ` 等 ${D.newPlayers.length} 人` : "";
    np.style.display = "block";
    np.innerHTML = `<img src="${ICON.egg}">新玩家（下次入榜）：${names}${more}`;
  }

  document.getElementById("f-gen").textContent = "由 " + (D.brand || "幻梦Bot") + " 生成";
  document.getElementById("f-next").textContent = D.nextTime ? "下一轮 " + D.nextTime : "";
  document.getElementById("f-hash").textContent = "#" + hash8((D.date || "") + "|" + Date.now());
})();
</script>
